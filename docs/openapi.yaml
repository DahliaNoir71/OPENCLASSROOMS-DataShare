openapi: 3.1.0
info:
  title: DataShare API
  version: 1.0.0
  description: >
    Contrat d'interface du prototype DataShare — transfert sécurisé de
    fichiers via liens temporaires. Toutes les réponses sont en JSON sauf le
    téléchargement (binaire). Aucune réponse n'est cachable : elles dépendent
    toutes soit de l'instant (expiration du lien), soit du porteur du jeton.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000/api
    description: Développement local

tags:
  - name: auth
    description: >
      Création de compte, connexion et cycle de vie du jeton (US03, US04).
      `/auth/register` et `/auth/login` sont ouvertes à tous et plafonnées à 5
      requêtes par minute et par adresse IP, car ce sont les cibles d'un
      bourrage d'identifiants. `/auth/me` et `/auth/logout` exigent un jeton et
      relèvent du limiteur standard de l'API — 60 requêtes par minute, comptées
      par utilisateur : un plafond par IP y pénaliserait une session normale et
      ferait s'entraver plusieurs utilisateurs partageant une même sortie NAT.
  - name: files
    description: Gestion des fichiers de l'utilisateur connecté (US01, US05, US06)
  - name: links
    description: >
      Accès public via lien de téléchargement (US02, US09). Ouvertes à tous
      comme les routes d'authentification, mais la menace n'est pas la même :
      ici le secret est dans l'URL. `GET /links/{token}` relève du limiteur
      standard — 60 requêtes par minute, comptées par adresse IP pour un
      appelant anonyme, ce qui est déjà le plafond d'énumération recherché.
      `POST /links/{token}/download` y ajoute son propre limiteur, à deux
      plafonds simultanés : 10 par minute et par lien, ce qui rend vaine la
      recherche du mot de passe d'un partage connu, et 30 par minute et par
      adresse IP, ce qui borne le balayage de l'espace des jetons sans gêner un
      bureau derrière une même sortie NAT.

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Création de compte (US03)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "201":
          description: Compte créé, jeton émis
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      summary: Connexion (US04)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authentification réussie
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [auth]
      summary: Utilisateur porteur du jeton (US04)
      operationId: me
      security: [{ bearerAuth: [] }]
      description: >
        Résout l'identité rattachée au jeton présenté. Sert au front à
        restaurer une session au chargement et à vérifier qu'un jeton conservé
        localement est toujours valide.
      responses:
        "200":
          description: Jeton valide, utilisateur résolu
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Déconnexion (US04)
      operationId: logout
      security: [{ bearerAuth: [] }]
      description: >
        Révoque le jeton courant côté serveur, en l'inscrivant sur la liste
        noire de jwt-auth. Ce n'est pas un simple oubli côté client : le même
        jeton, rejoué, est refusé jusqu'à son expiration naturelle.
      responses:
        "200":
          description: Jeton révoqué
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /files:
    get:
      tags: [files]
      summary: Historique des fichiers de l'utilisateur (US05)
      operationId: listFiles
      security: [{ bearerAuth: [] }]
      description: >
        Un fichier expiré reste listé tant que sa ligne existe en base : son
        inaccessibilité (`expires_at < now()`) est immédiate, mais son
        effacement — physique et de la ligne — est différé à la purge
        quotidienne (US10). Deux événements distincts le font disparaître de
        cet inventaire : sa suppression manuelle (US06), immédiate, et cette
        purge, différée. Entre l'échéance et la purge, la ligne reste listée
        avec `expired: true`.


        Le défaut `status=all` diverge délibérément de la lettre d'US06
        (« seuls les fichiers non expirés sont affichés par défaut ») : ce
        choix privilégie la stabilité du contrat — un appel sans paramètre
        reste le plus complet, les filtres sont purement additifs — et
        l'alignement sur le switch « Tous » de la maquette. Le comportement
        décrit par US06 reste atteignable côté client via `?status=active`.
        Cf. `docs/architecture.md`, section décisions d'API.
      parameters:
        - name: status
          in: query
          description: Filtre maquette « Tous / Actifs / Expiré »
          schema: { type: string, enum: [all, active, expired], default: all }
        - name: page
          in: query
          description: Numéro de page, à partir de 1
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: >
            Nombre d'éléments par page. Plafonné à 100
            (`DATASHARE_HISTORY_MAX_PER_PAGE`) pour borner la taille d'une
            réponse — cf. `PERF.md`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Page de l'inventaire, la plus récente en tête
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [files]
      summary: Téléversement d'un fichier (US01)
      operationId: uploadFile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Taille max 1 Go, extensions exécutables refusées
                password:
                  type: string
                  minLength: 6
                  maxLength: 72
                  description: >
                    Protection optionnelle du téléchargement (US09). Plafonné à
                    72 octets : au-delà, bcrypt tronque silencieusement, et une
                    valeur dont seuls les 72 premiers octets compteraient est
                    refusée plutôt qu'acceptée à moitié.
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 7
                  default: 7
                  description: Durée de validité du lien (US10)
      responses:
        "201":
          description: Fichier stocké, lien généré
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: >
            Corps de requête au-delà de `post_max_size`, refusé par la pile du
            framework avant le contrôleur. Un fichier au-delà de 1 Go mais sous
            cette limite serveur relève de la validation, donc du `422` : le
            `413` signale une limite d'infrastructure, pas la règle métier.
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /files/{id}:
    delete:
      tags: [files]
      summary: Suppression manuelle d'un fichier (US06)
      operationId: deleteFile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Fichier et métadonnées supprimés (irréversible) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            Identifiant inexistant, fichier appartenant à un autre
            utilisateur, ou identifiant non numérique : les trois cas
            répondent le même corps (arbitrage A2, docs/architecture.md). Le
            fichier d'un autre compte n'est délibérément pas distingué d'un
            identifiant inexistant, pour ne pas révéler qu'une ligne y
            correspond.
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /links/{token}:
    get:
      tags: [links]
      summary: Métadonnées publiques avant téléchargement (US02)
      operationId: getLinkMetadata
      security: []
      description: >
        Projection publique du fichier, réduite à ce dont l'écran de
        téléchargement a besoin. Ni identifiant interne, ni chemin physique, ni
        propriétaire, ni date de dépôt : le destinataire n'est pas le déposant.
        La présence effective des octets sur le disque n'est pas vérifiée ici —
        c'est le téléchargement qui contrôle juste avant d'ouvrir le flux.
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Métadonnées visibles avant téléchargement
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkMetadata" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "410": { $ref: "#/components/responses/LinkGone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /links/{token}/download:
    post:
      tags: [links]
      summary: Téléchargement du fichier (US02, US09)
      operationId: downloadFile
      security: []
      description: >
        POST (et non GET) car un mot de passe peut être requis ; il transite
        dans le corps, jamais dans l'URL — celle-ci part dans les journaux
        d'accès, l'historique du navigateur et le `Referer`. La méthode est la
        même que le fichier soit protégé ou non : un seul chemin de code, un
        seul jeu d'états d'erreur, et rien qu'un intermédiaire soit autorisé à
        stocker par défaut. Corollaire côté client : le corps se lit en `fetch`
        puis `Blob`, ce qui met le fichier en mémoire navigateur — limite
        assumée pour le prototype, cf. `docs/architecture.md`.


        Ordre des contrôles : existence du lien, expiration, mot de passe,
        présence physique des octets, puis ouverture du flux. Un lien échu
        répond donc `410` sans qu'un mot de passe soit vérifié.
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  maxLength: 72
                  description: >
                    Requis uniquement si le fichier est protégé. Aucune borne
                    minimale : une contrainte de longueur sur une entrée de
                    vérification divulguerait la politique de mot de passe.
      responses:
        "200":
          description: Contenu binaire du fichier
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
            Content-Length: { $ref: "#/components/headers/ContentLength" }
            Content-Type:
              description: >
                Type MIME relevé au dépôt, tel que stocké en base — jamais
                redétecté sur le contenu : le fichier physique est un UUID sans
                extension, et la valeur annoncée ici doit être celle que
                `GET /links/{token}` a déjà annoncée.
              required: true
              schema: { type: string, example: application/pdf }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: >
            Mot de passe absent ou incorrect. Un seul code et un seul message
            pour les deux cas : c'est un unique échec de vérification, et le
            client connaît déjà `protected` par les métadonnées.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "410": { $ref: "#/components/responses/LinkGone" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ShareToken:
      name: token
      in: path
      required: true
      description: >
        Jeton du lien de partage : 22 caractères base62, soit ≈ 131 bits
        d'entropie (longueur pilotée par `DATASHARE_TOKEN_LENGTH`). C'est un
        secret porteur — qui le détient télécharge le fichier —, d'où son
        exclusion des journaux applicatifs. Un jeton mal formé n'est pas
        distingué d'un jeton inconnu : les deux répondent `404`, aucun `400`
        n'est émis.
      schema:
        type: string
        pattern: "^[A-Za-z0-9]+$"
        example: 3xK9mQ7vTz2LpR8sN4wJyB

  headers:
    RetryAfter:
      description: Nombre de secondes à attendre avant un nouvel appel.
      required: true
      schema: { type: integer, example: 60 }

    NoStore:
      description: >
        Toujours `no-store, private` — Symfony ré-ordonne les directives par
        ordre alphabétique. Posé sur toute réponse `/api` par le middleware
        `NoStore`, y compris les erreurs. Une réponse conservée par un
        intermédiaire — proxy, CDN, cache du navigateur — servirait un
        contenu sans repasser par le contrôle d'expiration, le mot de passe
        de partage (US09) ou l'identité du porteur du jeton. Cf.
        `docs/architecture.md`, section « Cache ».
      required: true
      schema: { type: string, const: "no-store, private" }

    ContentDisposition:
      description: >
        Toujours `attachment`, jamais `inline` : les octets déposés ne
        s'affichent pas dans le navigateur du destinataire. C'est par cet
        en-tête, et non par le corps, que le nom de fichier d'origine remonte —
        le nom physique sur disque est un UUID sans extension.


        La forme est celle que produit Symfony, soit la double notation de la
        RFC 6266 : `filename` porte un repli translittéré en ASCII, et
        `filename*` le nom réel encodé en UTF-8. Ce second paramètre n'apparaît
        que si le nom sort de l'ASCII, et les guillemets ne sont posés que si la
        valeur contient un caractère hors du jeu `token` de HTTP (une espace,
        par exemple). Trois formes valides, donc, selon le nom :
        `attachment; filename=rapport.pdf`,
        `attachment; filename="mon rapport.pdf"`, et
        `attachment; filename=rapport-ete.pdf; filename*=utf-8''rapport-%C3%A9t%C3%A9.pdf`.
      required: true
      schema: { type: string }

    ContentLength:
      description: >
        Taille en octets, reprise de la colonne `size` plutôt que relevée sur
        le disque : c'est la même valeur que `GET /links/{token}` a annoncée, et
        sur un driver de stockage distant c'est une requête de métadonnées
        épargnée. Aucun `Accept-Ranges` ne l'accompagne : le prototype ne gère
        pas les requêtes partielles, donc une coupure impose de reprendre le
        téléchargement à zéro.
      required: true
      schema: { type: integer, example: 2457600 }

  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: >
            Libellé en français, destiné à être affiché tel quel : le front
            n'invente aucun libellé d'erreur métier.

    AuthResponse:
      type: object
      properties:
        token: { type: string, description: JWT à placer en Authorization Bearer }
        user:
          type: object
          properties:
            id: { type: integer }
            email: { type: string, format: email }

    UserResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            email: { type: string, format: email }

    FileResource:
      type: object
      properties:
        id: { type: integer }
        original_name: { type: string }
        size: { type: integer, description: octets }
        mime_type: { type: string }
        protected: { type: boolean, description: true si mot de passe défini }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean, description: calculé serveur }
        link:
          type: string
          format: uri
          description: >
            URL de l'écran de téléchargement de la SPA,
            `{DATASHARE_FRONTEND_URL}/l/{token}` — et non un point d'entrée de
            cette API. C'est le seul champ où le jeton apparaisse, noyé dans le
            lien à copier.
        created_at: { type: string, format: date-time }

    UploadResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/FileResource" }

    PaginationLinks:
      type: object
      description: Enveloppe native de Laravel pour une collection paginée.
      properties:
        first: { type: string, format: uri, nullable: true }
        last: { type: string, format: uri, nullable: true }
        prev: { type: string, format: uri, nullable: true }
        next: { type: string, format: uri, nullable: true }

    PaginationMeta:
      type: object
      description: >
        `status` et `per_page` sont reportés dans `next`/`prev` de
        `PaginationLinks` (préservation de la chaîne de requête) : un client
        qui suit ces liens n'a pas à les reconstruire lui-même.
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }

    FileListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FileResource" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    LinkMetadata:
      type: object
      required: [original_name, size, mime_type, protected, expires_at]
      description: >
        Renvoyé à plat, sans enveloppe `data`, à la différence d'UploadResponse.
      properties:
        original_name: { type: string }
        size: { type: integer, description: octets }
        mime_type: { type: string }
        protected: { type: boolean, description: true si un mot de passe est défini }
        expires_at: { type: string, format: date-time }

  responses:
    LinkNotFound:
      description: >
        Lien invalide. Volontairement indistinguable d'un lien jamais émis, mal
        formé, ou dont la purge a effacé la ligne.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    LinkGone:
      description: >
        Lien expiré — fichier plus disponible. Le `410` assume l'information
        « ce fichier a existé » : pour l'obtenir il faut déjà détenir le jeton,
        donc le secret du partage, et la distinguer du `404` évite d'envoyer un
        destinataire légitime chercher une faute de copie inexistante.


        La fenêtre est bornée par la purge quotidienne (US10) : une fois la
        ligne supprimée, le même lien répond `404`. Ce code couvre aussi le cas
        d'une ligne dont les octets ont disparu du disque — état identique pour
        le destinataire, signalé à l'exploitant par une ligne de journal.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    TooManyRequests:
      description: >
        Plafond de requêtes dépassé. Les compteurs sont tenus par le limiteur
        de débit dans le store de cache de l'application.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    ValidationError:
      description: Erreur de validation (format Laravel)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
