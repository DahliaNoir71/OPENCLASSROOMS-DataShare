openapi: 3.1.0
info:
  title: DataShare API
  version: 1.0.0
  description: >
    Contrat d'interface du prototype DataShare — transfert sécurisé de
    fichiers via liens temporaires. Toutes les réponses sont en JSON sauf le
    téléchargement (binaire). Aucune réponse n'est cachable : elles dépendent
    toutes soit de l'instant (expiration du lien), soit du porteur du jeton.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000/api
    description: Développement local

tags:
  - name: auth
    description: >
      Création de compte, connexion et cycle de vie du jeton (US03, US04).
      `/auth/register` et `/auth/login` sont ouvertes à tous et plafonnées à 5
      requêtes par minute et par adresse IP, car ce sont les cibles d'un
      bourrage d'identifiants. `/auth/me` et `/auth/logout` exigent un jeton et
      relèvent du limiteur standard de l'API — 60 requêtes par minute, comptées
      par utilisateur : un plafond par IP y pénaliserait une session normale et
      ferait s'entraver plusieurs utilisateurs partageant une même sortie NAT.
  - name: files
    description: Gestion des fichiers de l'utilisateur connecté (US01, US05, US06)
  - name: links
    description: Accès public via lien de téléchargement (US02, US09)

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Création de compte (US03)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "201":
          description: Compte créé, jeton émis
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      summary: Connexion (US04)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authentification réussie
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [auth]
      summary: Utilisateur porteur du jeton (US04)
      operationId: me
      security: [{ bearerAuth: [] }]
      description: >
        Résout l'identité rattachée au jeton présenté. Sert au front à
        restaurer une session au chargement et à vérifier qu'un jeton conservé
        localement est toujours valide.
      responses:
        "200":
          description: Jeton valide, utilisateur résolu
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Déconnexion (US04)
      operationId: logout
      security: [{ bearerAuth: [] }]
      description: >
        Révoque le jeton courant côté serveur, en l'inscrivant sur la liste
        noire de jwt-auth. Ce n'est pas un simple oubli côté client : le même
        jeton, rejoué, est refusé jusqu'à son expiration naturelle.
      responses:
        "200":
          description: Jeton révoqué
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /files:
    get:
      tags: [files]
      summary: Historique des fichiers de l'utilisateur (US05)
      operationId: listFiles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          description: Filtre maquette « Tous / Actifs / Expiré »
          schema: { type: string, enum: [all, active, expired], default: all }
      responses:
        "200":
          description: Liste des fichiers
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FileResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [files]
      summary: Téléversement d'un fichier (US01)
      operationId: uploadFile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Taille max 1 Go, extensions exécutables refusées
                password:
                  type: string
                  minLength: 6
                  description: Protection optionnelle du téléchargement (US09)
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 7
                  default: 7
                  description: Durée de validité du lien (US10)
      responses:
        "201":
          description: Fichier stocké, lien généré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: Fichier supérieur à 1 Go }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /files/{id}:
    delete:
      tags: [files]
      summary: Suppression manuelle d'un fichier (US06)
      operationId: deleteFile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Fichier et métadonnées supprimés (irréversible) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Le fichier appartient à un autre utilisateur }
        "404": { description: Fichier inexistant }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /links/{token}:
    get:
      tags: [links]
      summary: Métadonnées publiques avant téléchargement (US02)
      operationId: getLinkMetadata
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Métadonnées visibles avant téléchargement
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkMetadata" }
        "404": { description: Lien invalide }
        "410": { description: Lien expiré — fichier plus disponible }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /links/{token}/download:
    post:
      tags: [links]
      summary: Téléchargement du fichier (US02, US09)
      operationId: downloadFile
      security: []
      description: >
        POST (et non GET) car un mot de passe peut être requis ; il transite
        dans le corps, jamais dans l'URL.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Requis uniquement si le fichier est protégé
      responses:
        "200":
          description: Contenu binaire du fichier
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Mot de passe absent ou incorrect }
        "404": { description: Lien invalide }
        "410": { description: Lien expiré }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RetryAfter:
      description: Nombre de secondes à attendre avant un nouvel appel.
      required: true
      schema: { type: integer, example: 60 }

    NoStore:
      description: >
        Toujours `no-store, private` — Symfony ré-ordonne les directives par
        ordre alphabétique. Posé sur toute réponse `/api` par le middleware
        `NoStore`, y compris les erreurs. Une réponse conservée par un
        intermédiaire — proxy, CDN, cache du navigateur — servirait un
        contenu sans repasser par le contrôle d'expiration, le mot de passe
        de partage (US09) ou l'identité du porteur du jeton. Cf.
        `docs/architecture.md`, section « Cache ».
      required: true
      schema: { type: string, const: "no-store, private" }

    ContentDisposition:
      description: >
        `attachment; filename="<nom d'origine>"`. C'est par cet en-tête, et
        non par le corps, que le nom de fichier d'origine remonte au
        destinataire : le nom physique sur disque est un UUID.
      required: true
      schema: { type: string }

  schemas:
    AuthResponse:
      type: object
      properties:
        token: { type: string, description: JWT à placer en Authorization Bearer }
        user:
          type: object
          properties:
            id: { type: integer }
            email: { type: string, format: email }

    UserResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            email: { type: string, format: email }

    FileResource:
      type: object
      properties:
        id: { type: integer }
        original_name: { type: string }
        size: { type: integer, description: octets }
        mime_type: { type: string }
        protected: { type: boolean, description: true si mot de passe défini }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean, description: calculé serveur }
        link: { type: string, format: uri, description: URL publique de téléchargement }
        created_at: { type: string, format: date-time }

    UploadResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/FileResource" }

    LinkMetadata:
      type: object
      properties:
        original_name: { type: string }
        size: { type: integer }
        mime_type: { type: string }
        protected: { type: boolean }
        expires_at: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    TooManyRequests:
      description: >
        Plafond de requêtes dépassé. Les compteurs sont tenus par le limiteur
        de débit dans le store de cache de l'application.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    ValidationError:
      description: Erreur de validation (format Laravel)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
