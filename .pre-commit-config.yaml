# =============================================================================
# Pre-commit configuration — OPENCLASSROOMS-DataShare (monorepo)
# =============================================================================
# Stack reelle du depot :
#   backend/   Laravel 13 / PHP 8.3  — Composer, Pint, PHPUnit
#   frontend/  Vue 3 + TypeScript    — npm, oxlint, ESLint, Prettier, vue-tsc
#   docs/      contrat OpenAPI (docs/openapi.yaml)
#   compose.yaml : PostgreSQL 17 local
#
# -- PRINCIPE : PARTITION STRICTE AVEC LA CI ---------------------------------
# Ces hooks et .github/workflows/ci.yml ne se recouvrent PAS. Chaque controle
# vit a exactement UN endroit, choisi par sa nature :
#
#   ICI      ce qui CORRIGE le code (formateurs), ce qui garde le moment du
#            commit (branche, marqueurs de conflit, gros fichiers), et le seul
#            controle que la CI ne peut structurellement pas faire : la
#            validation de son propre workflow.
#
#   EN CI    TOUTE la verification : Pint --test, oxlint, ESLint, vue-tsc,
#            Prettier --check, PHPUnit, Vitest, build, composer validate,
#            redocly lint, absence de dd()/dump(), gitleaks. Non contournable,
#            c'est elle qui conditionne le merge via le check requis "CI OK".
#
# Consequence directe : AUCUN hook ici ne rejoue une verification de la CI. Un
# doublon n'apporterait que du delai gagne, au prix d'un commit ralenti et
# d'une double maintenance — et une gate lente finit contournee au --no-verify,
# donc ne vaut rien. C'est pourquoi il n'y a pas d'etage pre-push : tout ce
# qu'il contenait (PHPUnit, ESLint, vue-tsc, Vitest, Pint --test) etait un
# doublon de la CI.
#
# COROLLAIRE, a respecter avant d'ajouter un hook : si la CI le fait deja, il
# n'a pas sa place ici. Si c'est une verification que la CI ne fait pas encore,
# l'ajouter A LA CI plutot qu'ici — un controle contournable par --no-verify
# n'est pas une gate.
#
# Adapte du baseline XOps "complet", elague de ce qui n'existe pas ici :
# ni Python (ruff/bandit/vulture/uv-lock), ni GitLab CI (check-gitlab-ci),
# ni pnpm (le frontend est en npm + package-lock.json).
#
# Installation :
#   pipx install pre-commit        # (deja installe ici)
#   pre-commit install
# Si un etage pre-push a ete installe par une version anterieure de ce fichier,
# le retirer explicitement — `pre-commit install` ne desinstalle rien :
#   pre-commit uninstall --hook-type pre-push
# Verification :
#   pre-commit run --all-files
# =============================================================================

# Un seul type de hook : il n'y a plus d'etage pre-push (voir l'en-tete).
default_install_hook_types: [pre-commit]

# S'applique aux hooks qui NE DECLARENT PAS leurs propres stages ; un hook qui
# en declare gagne toujours (dans pre-commit-hooks v6.0.0, trailing-whitespace,
# end-of-file-fixer et check-added-large-files declarent
# [pre-commit, pre-push, manual]). Sans consequence tant qu'aucun hook pre-push
# n'est installe, mais a garder en tete si l'etage revenait un jour.
default_stages: [pre-commit]

repos:
  # ===================================================
  # 1. Hygiene, portabilite et garde-fous du commit
  # ===================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --- Correcteurs : reecrivent le fichier, donc n'ont de sens qu'ici ---
      # La CI ne peut pas corriger : elle reecrirait un runner jetable puis
      # sortirait en succes, soit un faux vert. Elle n'a pas d'equivalent de ces
      # trois hooks, il n'y a donc aucun doublon.
      # Les lockfiles sont generes : on n'y touche pas.
      - id: trailing-whitespace
        exclude: ^(frontend/package-lock\.json|backend/composer\.lock)$
      - id: end-of-file-fixer
        exclude: ^(frontend/package-lock\.json|backend/composer\.lock)$
      # Poste de dev sous WSL, depot potentiellement clone sous Windows.
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^(frontend/package-lock\.json|backend/composer\.lock)$

      # --- Validation de configuration : aucun equivalent en CI ---
      # YAML versionnes : compose.yaml, docs/openapi.yaml, ce fichier. Le lint
      # OpenAPI proprement dit (schema 3.1) est en CI ; ici, syntaxe seule.
      - id: check-yaml
      # tsconfig.app/node/vitest.json sont du JSONC (commentaires) : le parser
      # strict les rejette, d'ou l'exclusion.
      - id: check-json
        exclude: (^|/)tsconfig.*\.json$

      # --- Garde-fous propres au moment du commit ---
      # Ceux-ci n'ont de sens qu'avant que le commit existe : une fois l'objet
      # cree, le constat arrive trop tard. La CI ne les rejoue donc pas.
      - id: check-case-conflict
      - id: check-merge-conflict
      # 1024 Ko et non 500 : composer.lock (315 Ko) et package-lock.json
      # (306 Ko) sont deja proches de la moitie du seuil et vont grossir.
      - id: check-added-large-files
        args: ['--maxkb=1024']
      # Volontairement ABSENT : detect-private-key. Une cle privee est un cas
      # particulier de secret, et gitleaks le couvre deja en CI (job security)
      # avec bien plus de regles. Le garder ici serait un doublon — le meme
      # raisonnement que celui qui a sorti le hook gitleaks local.
      #
      # main est protegee cote GitHub (push rejete par le serveur). Ce hook fait
      # echouer le commit AVANT, au lieu de laisser des commits a deplacer.
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # ===================================================
  # 2. Backend Laravel — formatage uniquement
  # ===================================================
  # `language: system` : Pint vient de backend/vendor (composer install),
  # pre-commit ne le gere pas.
  - repo: local
    hooks:
      # CORRECTEUR, pas un doublon du `pint --test` de la CI : celui-ci verifie
      # et echoue, celui-la reecrit. --dirty se base sur git et non sur les
      # arguments, d'ou pass_filenames: false ; pre-commit met de cote les
      # modifications non indexees, donc --dirty voit exactement les fichiers
      # staged. Quand il reecrit, le hook echoue : il suffit de re-`git add`.
      - id: pint
        name: Laravel Pint (backend)
        entry: bash -c 'cd backend && ./vendor/bin/pint --dirty'
        language: system
        files: ^backend/.*\.php$
        pass_filenames: false

  # ===================================================
  # 3. Frontend Vue 3 — formatage uniquement
  # ===================================================
  # Prerequis : `npm --prefix frontend install` (fournit les binaires).
  # pass_filenames: false volontairement : pre-commit passe des chemins relatifs
  # a la RACINE (frontend/src/App.vue) alors que l'entry fait `cd frontend` —
  # "$@" resoudrait frontend/frontend/src/App.vue et casserait le hook.
  - repo: local
    hooks:
      # CORRECTEUR, pendant du `prettier --check` de la CI. Cible src/, comme le
      # script `format`.
      - id: frontend-prettier
        name: prettier --write (frontend/src)
        entry: bash -c 'cd frontend && npx prettier --write src/'
        language: system
        files: ^frontend/src/.*\.(ts|vue|css|json)$
        pass_filenames: false

  # ===================================================
  # 4. Workflow GitHub Actions — actionlint
  # ===================================================
  # LE cas ou un controle doit etre local : la CI ne peut pas se verifier
  # elle-meme. Un workflow malforme ne demarre pas, et un workflow qui ne
  # demarre pas laisse le check requis "CI OK" EN ATTENTE au lieu de virer au
  # rouge — la PR est bloquee sans qu'aucun message n'explique pourquoi.
  # check-yaml (section 1) ne voit que la syntaxe YAML ; il laisse passer tout
  # ce qui est propre a Actions : `needs:` vers un job inexistant, expression
  # ${{ }} malformee, `runs-on` mal orthographie, cle inconnue.
  #
  # `language: golang` : pre-commit (4.6.1 ici) telecharge lui-meme la
  # toolchain, aucun Go a installer. L'amont fournit aussi `actionlint-docker`
  # (Docker est deja un prerequis du projet) et `actionlint-system`.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
