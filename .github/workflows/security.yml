name: Security

# Bloc sécurité réutilisable : appelé par pr.yml (uses:) et rejoué seul
# chaque semaine (dérive entre deux PR).
#
# Pas de concurrency ici, délibérément (point tranché sur chore/ci) :
# - en appel workflow_call, l'isolation est déjà assurée par le groupe de
#   concurrency de pr.yml (pr-${{ github.ref }}, cancel-in-progress) : ce
#   job hérite du cycle de vie de ce run, un groupe supplémentaire ici
#   n'apporterait rien et ouvrirait une interaction appelant/appelé non
#   documentée par GitHub (le comportement de concurrency à l'intérieur
#   d'un workflow réutilisable n'est pas garanti indépendant du run
#   appelant) ;
# - en schedule, la cadence hebdomadaire rend un chevauchement entre deux
#   exécutions planifiées quasi impossible, et sans conséquence si cela
#   arrivait (deux scans en parallèle, aucun état partagé, aucune porte
#   comme e2e/ci-ok qui en dépendrait) — contrairement au risque identifié
#   sur les jobs rapides de push.yml, ici une éventuelle collision entre le
#   run programmé et l'appel post-merge (push sur main, même ref que le
#   schedule) n'annule aucun check requis : security n'apparaît que dans
#   ci-ok de pr.yml, jamais dans le run schedule autonome.

on:
  workflow_call:
  schedule:
    # Détection de dérive entre deux PR (CVE publiée sur une dépendance déjà
    # mergée) : tous les lundis à 06:00 UTC.
    - cron: '0 6 * * 1'

jobs:
  security:
    name: Audits et scans de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet requis par Gitleaks (mode git)

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # composer audit lit composer.lock : ni composer install ni vendor/ ne
      # sont nécessaires. Politique D2 : bloquant dès le premier avis (exit
      # code binaire de la commande elle-même, aucun seuil de sévérité natif).
      - name: composer audit
        working-directory: backend
        run: composer audit --locked

      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'

      # --package-lock-only : construit l'arbre virtuel depuis
      # package-lock.json et interroge le endpoint bulk du registre. Sans ce
      # flag et sans node_modules/, npm se rabattait sur l'endpoint quick,
      # retiré par npm en septembre 2026 (400 Bad Request depuis).
      # Retry : le endpoint bulk peut répondre 503 par intermittence
      # (constaté lors de la migration quick -> bulk). On ne rejoue que les
      # erreurs d'endpoint — une vraie détection d'advisories échoue au
      # premier passage, sans retry.
      # Politique D2 inchangée : bloquant à partir de "high".
      - name: npm audit
        working-directory: frontend
        run: |
          for i in 1 2 3; do
            if npm audit --audit-level=high --package-lock-only > /tmp/npm-audit.log 2>&1; then
              cat /tmp/npm-audit.log
              exit 0
            fi
            cat /tmp/npm-audit.log
            if ! grep -q "audit endpoint returned an error" /tmp/npm-audit.log; then
              exit 1
            fi
            if [ "$i" -lt 3 ]; then
              echo "Endpoint d'audit indisponible (tentative $i/3), nouvel essai dans 30 s"
              sleep 30
            fi
          done
          echo "Endpoint d'audit indisponible après 3 tentatives"
          exit 1

      # Checkout nu, sans composer install ni npm ci : vendor/ et
      # node_modules/ sont absents, backend/.env est gitignoré donc absent
      # lui aussi. Les findings déjà classés dans SECURITY.md §Ignorées
      # (dépendances Python vendorisées de Mockery, JWT_SECRET de dev,
      # fixtures de tests tiers) ne peuvent donc pas se reproduire dans ce
      # scan (D4) : aucun fichier d'exclusion n'est nécessaire ici.
      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Gitleaks (working tree + historique)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
